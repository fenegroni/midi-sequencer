[package]
name = "midi-sequencer"
version = "0.2.0"
edition = "2021"
description = "A MIDI loop recorder for the AKAI MPK mini play 3 with a built-in MCP server"
license = "GPL-3.0-or-later"
authors = ["Filippo Negroni"]

[dependencies]
chrono = "0.4"
eframe = "0.31"
midir = "0.10"
serde_json = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 3
